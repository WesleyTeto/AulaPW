<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styleMain.css">
    <title>Agenda e Previsão</title>
</head>

<body>
    <div id="app" class="container">
        <div class="containerCenter">
            <div class="ctrlMes">
                <button class="botaoMes " @click="mesAnterior"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>{{ nomeMes }} {{ anoAtual }}</h2>
                <button class="botaoMes" @click="proximoMes"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="agendaAll">
                <div class="eixoX">
                    <h1>Domingo</h1>
                    <h1>Segunda</h1>
                    <h1>Terça</h1>
                    <h1>Quarta</h1>
                    <h1>Quinta</h1>
                    <h1>Sexta</h1>
                    <h1>Sábado</h1>
                </div>
                <div class="agendaDias">
                    <!-- Espaços antes do primeiro dia -->
                    <div class="dia vazio" v-for="vazio in diasVazios" :key="'vazio-' + vazio">
                    </div>

                    <!-- Dias gerados automaticamente -->
                    <div class="dia" v-for="dia in diasDoMes" :key="dia">

                        <span>{{ dia }}</span>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="function.js"></script>
</body>

</html>
